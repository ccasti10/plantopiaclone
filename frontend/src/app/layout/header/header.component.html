<header class="bg-white shadow-md sticky top-0 z-50">
  <nav class="container mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center space-x-2">
          <svg class="w-10 h-10 text-forest-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
          </svg>
          <span class="text-2xl font-bold text-forest-700">Plantopia</span>
        </a>
      </div>

      <!-- Navegación Desktop -->
      <div class="hidden md:flex items-center space-x-6">
        <a routerLink="/" routerLinkActive="text-forest-600" [routerLinkActiveOptions]="{exact: true}"
           class="text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Inicio
        </a>
        <a routerLink="/productos" routerLinkActive="text-forest-600"
           class="text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Productos
        </a>
        <a routerLink="/plantas" routerLinkActive="text-forest-600"
           class="text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Plantas
        </a>
        <a routerLink="/ofertas" routerLinkActive="text-forest-600"
           class="text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Ofertas
        </a>
        <a routerLink="/nosotros" routerLinkActive="text-forest-600"
           class="text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Nosotros
        </a>
      </div>

      <!-- Iconos de Acción -->
      <div class="flex items-center space-x-4">
        <!-- Búsqueda -->
        <button (click)="toggleBusqueda()" class="text-stone-700 hover:text-forest-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <!-- Usuario -->
        @if (authService.usuarioActual()) {
          <div class="relative group">
            <button class="text-stone-700 hover:text-forest-600 transition-colors">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </button>
            <!-- Dropdown Menu -->
            <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 hidden group-hover:block">
              <a routerLink="/perfil" class="block px-4 py-2 text-stone-700 hover:bg-forest-50">Mi Perfil</a>
              <a routerLink="/pedidos" class="block px-4 py-2 text-stone-700 hover:bg-forest-50">Mis Pedidos</a>
              <button (click)="cerrarSesion()" class="w-full text-left block px-4 py-2 text-stone-700 hover:bg-forest-50">
                Cerrar Sesión
              </button>
            </div>
          </div>
        } @else {
          <a routerLink="/auth/login" class="text-stone-700 hover:text-forest-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </a>
        }

        <!-- Carrito -->
        <a routerLink="/carrito" class="relative text-stone-700 hover:text-forest-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          @if (carritoService.cantidadItems() > 0) {
            <span class="absolute -top-2 -right-2 bg-forest-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
              {{ carritoService.cantidadItems() }}
            </span>
          }
        </a>

        <!-- Menú Móvil Button -->
        <button (click)="toggleMenu()" class="md:hidden text-stone-700 hover:text-forest-600 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Barra de Búsqueda Mobile -->
    @if (busquedaAbierta) {
      <div class="mt-4 md:hidden">
        <input type="text" placeholder="Buscar plantas, productos..."
               class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-500">
      </div>
    }

    <!-- Menú Móvil -->
    @if (menuAbierto) {
      <div class="md:hidden mt-4 space-y-2">
        <a routerLink="/" (click)="toggleMenu()"
           class="block py-2 text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Inicio
        </a>
        <a routerLink="/productos" (click)="toggleMenu()"
           class="block py-2 text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Productos
        </a>
        <a routerLink="/plantas" (click)="toggleMenu()"
           class="block py-2 text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Plantas
        </a>
        <a routerLink="/ofertas" (click)="toggleMenu()"
           class="block py-2 text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Ofertas
        </a>
        <a routerLink="/nosotros" (click)="toggleMenu()"
           class="block py-2 text-stone-700 hover:text-forest-600 transition-colors font-medium">
          Nosotros
        </a>
      </div>
    }
  </nav>
</header>
